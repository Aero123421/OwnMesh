name: Materialize PR 129 hardening changes

on:
  push:
    branches:
      - fix/resolve-open-issues-v1.2.17
    paths:
      - .github/workflows/materialize-pr-129.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-pr-129
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/resolve-open-issues-v1.2.17
          fetch-depth: 0

      - name: Reconstruct and validate patch
        shell: bash
        run: |
          set -euo pipefail
          test -d .github/patch8
          mapfile -t parts < <(find .github/patch8 -maxdepth 1 -type f -name 'part-*' -print | sort)
          test "${#parts[@]}" -ge 2
          cat "${parts[@]}" | tr -d '\r\n' > "$RUNNER_TEMP/ownmesh-changes.patch.gz.b64"
          base64 --decode "$RUNNER_TEMP/ownmesh-changes.patch.gz.b64" > "$RUNNER_TEMP/ownmesh-changes.patch.gz"
          gzip -dc "$RUNNER_TEMP/ownmesh-changes.patch.gz" > "$RUNNER_TEMP/ownmesh-changes.patch"
          test -s "$RUNNER_TEMP/ownmesh-changes.patch"
          grep -q '^diff --git ' "$RUNNER_TEMP/ownmesh-changes.patch"
          git apply --check --whitespace=nowarn "$RUNNER_TEMP/ownmesh-changes.patch"

      - name: Apply patch and remove transport artifacts
        shell: bash
        run: |
          set -euo pipefail
          git apply --index --whitespace=nowarn "$RUNNER_TEMP/ownmesh-changes.patch"
          rm -rf .github/patch .github/patch8
          rm -f .github/workflows/source-export.yml
          rm -f .github/workflows/materialize-pr-129.yml
          git add -A
          changed="$(git diff --cached --name-only)"
          printf '%s\n' "$changed"
          source_count="$(printf '%s\n' "$changed" | grep -Ev '^\.github/(patch|patch8|workflows/(source-export|materialize-pr-129)\.yml)' | sed '/^$/d' | wc -l)"
          test "$source_count" -ge 5
          if git diff --cached --check; then
            :
          else
            echo 'Patch introduced whitespace errors' >&2
            exit 1
          fi

      - name: Commit materialized changes
        shell: bash
        env:
          BRANCH: fix/resolve-open-issues-v1.2.17
        run: |
          set -euo pipefail
          git config user.name "PHAITOTI"
          git config user.email "184829077+Aero123421@users.noreply.github.com"
          git commit -m "fix: resolve remaining reliability and security hardening issues"
          git push origin "HEAD:$BRANCH"
