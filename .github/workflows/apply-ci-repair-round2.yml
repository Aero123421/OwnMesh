name: Apply CI repair round 2

on:
  push:
    branches:
      - fix/resolve-open-issues-v1.2.17
    paths:
      - .github/ci-repair-round2.patch
      - .github/workflows/apply-ci-repair-round2.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/resolve-open-issues-v1.2.17
          fetch-depth: 0
      - name: Install Rust 1.92 formatter
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: '1.92.0'
          components: rustfmt
      - name: Apply repair and format
        shell: bash
        run: |
          set -euo pipefail
          git apply --index .github/ci-repair-round2.patch
          cargo fmt --all
          rm -f .github/ci-repair-round2.patch .github/workflows/apply-ci-repair-round2.yml
          git add -A
          git diff --cached --check
          git config user.name 'PHAITOTI'
          git config user.email '184829077+Aero123421@users.noreply.github.com'
          git commit -m 'fix(update): satisfy archive accounting clippy gates'
          git push origin HEAD:fix/resolve-open-issues-v1.2.17

# The file update below intentionally triggers this already-installed workflow.
