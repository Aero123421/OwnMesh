name: Apply OwnMesh CI fixes round 1

on:
  push:
    branches:
      - fix/resolve-open-issues-v1.2.17
    paths:
      - .github/fix-round1.patch
      - .github/workflows/apply-fix-round1.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify and apply corrections
        shell: bash
        run: |
          set -euo pipefail
          echo "55594b3b7d6a3de92465d595b58e8a2ffea3f954167ff3248c66f6c9e4a64e8d  .github/fix-round1.patch" | sha256sum --check --strict
          git apply --check .github/fix-round1.patch
          git apply .github/fix-round1.patch
          rm -f .github/fix-round1.patch .github/workflows/apply-fix-round1.yml
          git add -A
          git diff --check --cached
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Aero123421"
          git config user.email "184829077+Aero123421@users.noreply.github.com"
          git commit -m "fix(ci): correct updater ownership and request decoding"
          git push origin "HEAD:${GITHUB_REF_NAME}"
