name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Reusable workflows are hard prerequisites. A failed/cancelled CI or Security
  # invocation leaves every build/publish job skipped by normal needs semantics.
  ci-gate:
    name: Required CI gate
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  security-gate:
    name: Required security gate
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security.yml

  build:
    name: Release build (${{ matrix.asset }})
    needs: [ci-gate, security-gate]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: ownmesh-windows-x64.zip
            platform: windows-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: ownmesh-macos-arm64.tar.gz
            platform: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: ownmesh-macos-x64.tar.gz
            platform: macos-x64
            cross: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: ownmesh-linux-x64.tar.gz
            platform: linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: ownmesh-linux-arm64.tar.gz
            platform: linux-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.92 toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.92.0"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Verify tag, workspace version, and release notes
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)
          test "${GITHUB_REF_NAME}" = "v${version}"
          test -s "docs/RELEASE_NOTES_${GITHUB_REF_NAME}.md"
          test -s docs/release-keys/minisign.pub
      - name: Build release binaries (locked)
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          CFLAGS_aarch64_unknown_linux_musl: -mno-outline-atomics
        run: |
          set -euo pipefail
          cargo build --release --workspace --locked --target "${TARGET}"
      - name: Package portable archive (unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
          CROSS: ${{ matrix.cross }}
        run: |
          set -euo pipefail
          staging="dist/pkg"
          mkdir -p "${staging}"
          for binary in ownmesh ownmesh-tui ownmeshd ownmesh-session-host ownmesh-broker; do
            source="target/${TARGET}/release/${binary}"
            test -s "${source}"
            cp "${source}" "${staging}/"
            chmod 0755 "${staging}/${binary}"
          done
          cp LICENSE NOTICE README.md "${staging}/"
          cp "docs/RELEASE_NOTES_${GITHUB_REF_NAME}.md" "${staging}/RELEASE_NOTES.md"
          test -s "${staging}/LICENSE"
          test -s "${staging}/NOTICE"
          test -s "${staging}/README.md"
          test -s "${staging}/RELEASE_NOTES.md"
          tar -C "${staging}" -czf "dist/${ASSET}" \
            ownmesh ownmesh-tui ownmeshd ownmesh-session-host ownmesh-broker \
            LICENSE NOTICE README.md RELEASE_NOTES.md
          test -s "dist/${ASSET}"
          (
            cd dist
            sha256sum "${ASSET}" > "${ASSET}.sha256"
          )
          mkdir -p dist/verify
          tar -xzf "dist/${ASSET}" -C dist/verify ownmesh
          if [ "${CROSS}" != "true" ]; then
            ./dist/verify/ownmesh --version
          else
            file dist/verify/ownmesh
          fi
      - name: Package portable archive (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          $ErrorActionPreference = "Stop"
          $staging = "dist/pkg"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          foreach ($binary in @("ownmesh","ownmesh-tui","ownmeshd","ownmesh-session-host","ownmesh-broker")) {
            $source = "target/$env:TARGET/release/$binary.exe"
            if (-not (Test-Path -LiteralPath $source) -or (Get-Item $source).Length -le 0) {
              throw "missing $source"
            }
            Copy-Item -LiteralPath $source -Destination $staging
          }
          Copy-Item LICENSE, NOTICE, README.md $staging
          Copy-Item "docs/RELEASE_NOTES_$env:GITHUB_REF_NAME.md" (Join-Path $staging "RELEASE_NOTES.md")
          Compress-Archive -Path (Join-Path $staging "*") -DestinationPath "dist/$env:ASSET" -Force
          $h = (Get-FileHash "dist/$env:ASSET" -Algorithm SHA256).Hash.ToLower()
          # LF, not CRLF: Out-File's default trailing CRLF breaks sha256sum -c under Git Bash.
          "$h  $env:ASSET`n" | Out-File -Encoding ascii -NoNewline "dist/$env:ASSET.sha256"
          Expand-Archive "dist/$env:ASSET" -DestinationPath dist/verify -Force
          & ./dist/verify/ownmesh.exe --version
          if ($LASTEXITCODE -ne 0) { throw "version smoke failed" }
      - name: Upload platform artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          if-no-files-found: error
          retention-days: 30

  release-candidate-e2e:
    name: Exact packaged Linux artifact against local workerd
    needs: [ci-gate, security-gate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.92 toolchain for isolated enrollment fixture
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.92.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-candidate-e2e
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Enable pinned pnpm and install Worker dependencies
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm install --frozen-lockfile
      - name: Download the packaged Linux x64 release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-linux-x64
          path: release-candidate
      - name: Verify and extract the exact archive
        shell: bash
        run: |
          set -euo pipefail
          cd release-candidate
          sha256sum --check --strict ownmesh-linux-x64.tar.gz.sha256
          mkdir extracted
          tar -xzf ownmesh-linux-x64.tar.gz -C extracted
          for binary in ownmesh ownmesh-tui ownmeshd ownmesh-session-host ownmesh-broker; do
            test -x "extracted/${binary}"
          done
          ./extracted/ownmesh --version
          ./extracted/ownmeshd --version
      - name: Public MCP, device, filesystem, command, session, restart and recovery gate
        env:
          OWNMESH_E2E_ARTIFACT_DIR: ${{ github.workspace }}/release-candidate/extracted
        run: python scripts/tests/run_e2e_loopback_tests.py
      - name: Two-Agent resumable transfer gate
        env:
          OWNMESH_E2E_ARTIFACT_DIR: ${{ github.workspace }}/release-candidate/extracted
        run: python scripts/tests/test_e9_workerd_transfer.py

  distribution-metadata:
    name: Installers and Homebrew formula
    needs: [ci-gate, security-gate, build, release-candidate-e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download binary checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: binary-assets
          merge-multiple: true
      - name: Render installers and package-manager metadata
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release-assets
          cp installers/ownmesh-installer.sh release-assets/
          cp installers/ownmesh-installer.ps1 release-assets/
          cp docs/release-keys/minisign.pub release-assets/
          python3 scripts/render_distribution.py \
            --version "$version" \
            --checksums-dir binary-assets \
            --output-dir generated \
            --release-assets-dir release-assets
          (
            cd release-assets
            for asset in ownmesh-installer.sh ownmesh-installer.ps1 ownmesh.rb minisign.pub; do
              sha256sum "$asset" > "$asset.sha256"
            done
          )
      - name: Stage installers and package-manager metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-distribution-metadata
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish gated release
    needs: [ci-gate, security-gate, build, release-candidate-e2e, distribution-metadata]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download all platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Download strict SBOMs from Security gate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-cyclonedx
          path: dist
      - name: Fail if any required artifact or current-tag notes are absent
        run: |
          set -euo pipefail
          test -s "docs/RELEASE_NOTES_${GITHUB_REF_NAME}.md"
          test -s docs/release-keys/minisign.pub
          version="${GITHUB_REF_NAME#v}"
          cat > dist/ownmesh-release-meta.json <<EOF
          {
            "schema_version": 1,
            "version": "${version}",
            "channel": "stable",
            "min_protocol": 1,
            "max_protocol": 1
          }
          EOF
          for asset in \
            ownmesh-windows-x64.zip \
            ownmesh-macos-arm64.tar.gz \
            ownmesh-macos-x64.tar.gz \
            ownmesh-linux-x64.tar.gz \
            ownmesh-linux-arm64.tar.gz
          do
            test -s "dist/${asset}"
            test -s "dist/${asset}.sha256"
          done
          test -s dist/ownmesh-installer.sh
          test -s dist/ownmesh-installer.ps1
          test -s dist/ownmesh.rb
          test -s dist/sbom-rust.cdx.json
          test -s dist/sbom-control-plane.cdx.json
          # Validate archive membership for each portable asset.
          python3 - <<'PY'
          import json, tarfile, zipfile
          from pathlib import Path
          required = {
              "ownmesh-windows-x64.zip": [f"{b}.exe" for b in
                  ["ownmesh","ownmesh-tui","ownmeshd","ownmesh-session-host","ownmesh-broker"]]
                  + ["LICENSE","NOTICE","README.md","RELEASE_NOTES.md"],
              "ownmesh-macos-arm64.tar.gz": ["ownmesh","ownmesh-tui","ownmeshd","ownmesh-session-host","ownmesh-broker","LICENSE","NOTICE","README.md","RELEASE_NOTES.md"],
              "ownmesh-macos-x64.tar.gz": ["ownmesh","ownmesh-tui","ownmeshd","ownmesh-session-host","ownmesh-broker","LICENSE","NOTICE","README.md","RELEASE_NOTES.md"],
              "ownmesh-linux-x64.tar.gz": ["ownmesh","ownmesh-tui","ownmeshd","ownmesh-session-host","ownmesh-broker","LICENSE","NOTICE","README.md","RELEASE_NOTES.md"],
              "ownmesh-linux-arm64.tar.gz": ["ownmesh","ownmesh-tui","ownmeshd","ownmesh-session-host","ownmesh-broker","LICENSE","NOTICE","README.md","RELEASE_NOTES.md"],
          }
          root = Path("dist")
          for asset, members in required.items():
              path = root / asset
              names = set()
              if asset.endswith(".zip"):
                  with zipfile.ZipFile(path) as zf:
                      names = {Path(n).name for n in zf.namelist() if not n.endswith("/")}
              else:
                  with tarfile.open(path, "r:gz") as tf:
                      names = {Path(m.name).name for m in tf.getmembers() if m.isfile()}
              missing = [m for m in members if m not in names]
              assert not missing, (asset, missing)
          for path in ["dist/sbom-rust.cdx.json", "dist/sbom-control-plane.cdx.json"]:
              with open(path, encoding="utf-8") as handle:
                  data = json.load(handle)
              components = data.get("components")
              assert data.get("bomFormat") == "CycloneDX", path
              assert data.get("specVersion") == "1.5", path
              assert isinstance(data.get("version"), int) and data["version"] > 0, path
              assert isinstance(components, list) and components, f"empty SBOM: {path}"
              for component in components:
                  assert component.get("type") and component.get("name"), (path, component)
          PY
      - name: Generate aggregate SHA256SUMS (all published assets)
        working-directory: dist
        run: |
          set -euo pipefail
          rm -f SHA256SUMS SHA256SUMS.minisig
          sha256sum \
            ownmesh-windows-x64.zip \
            ownmesh-macos-arm64.tar.gz \
            ownmesh-macos-x64.tar.gz \
            ownmesh-linux-x64.tar.gz \
            ownmesh-linux-arm64.tar.gz \
            ownmesh-installer.sh \
            ownmesh-installer.ps1 \
            ownmesh.rb \
            minisign.pub \
            ownmesh-*.sha256 \
            ownmesh-release-meta.json \
            sbom-rust.cdx.json \
            sbom-control-plane.cdx.json \
            > SHA256SUMS
          test -s SHA256SUMS
      - name: Generate machine-readable release evidence
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/generate_release_evidence.py \
            --version "${VERSION#v}" \
            --commit "${COMMIT}" \
            --checksums dist/SHA256SUMS \
            --catalog-current release/mcp-catalog-current.json \
            --catalog-baseline release/mcp-catalog-baseline-v2.json \
            --workflow-url "${WORKFLOW_URL}" \
            --output dist/ownmesh-release-evidence.json
          test -s dist/ownmesh-release-evidence.json
          grep -q '"completeness_claim": false' dist/ownmesh-release-evidence.json
          (cd dist && sha256sum ownmesh-release-evidence.json >> SHA256SUMS)
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/ownmesh-*.zip
            dist/ownmesh-*.tar.gz
            dist/ownmesh-installer.*
            dist/ownmesh.rb
            dist/ownmesh-release-meta.json
            dist/ownmesh-release-evidence.json
            dist/sbom-*.cdx.json
            dist/SHA256SUMS
      - name: Require minisign key material (no degraded fallback)
        id: signing
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SECRET_KEY}" ]; then
            echo "::error::MINISIGN_SECRET_KEY secret is required for formal OwnMesh releases"
            exit 1
          fi
          if [ ! -s docs/release-keys/minisign.pub ]; then
            echo "::error::docs/release-keys/minisign.pub trust root is required"
            exit 1
          fi
          echo "available=true" >> "${GITHUB_OUTPUT}"
      - name: Install minisign
        run: |
          set -euo pipefail
          # apt-get minisign can stall indefinitely on ubuntu-latest (v1.2.15).
          # Same pinned jedisct1/minisign 0.11 linux x64 archive as the installer.
          url="https://github.com/jedisct1/minisign/releases/download/0.11/minisign-0.11-linux.tar.gz"
          expect="f0a0954413df8531befed169e447a66da6868d79052ed7e892e50a4291af7ae0"
          archive="$(mktemp)"
          trap 'rm -f "${archive}"' EXIT
          curl -fsSL --retry 3 --retry-delay 2 -o "${archive}" "${url}"
          echo "${expect}  ${archive}" | sha256sum -c -
          workdir="$(mktemp -d)"
          trap 'rm -f "${archive}"; rm -rf "${workdir}"' EXIT
          tar -xzf "${archive}" -C "${workdir}"
          test -x "${workdir}/minisign-linux/x86_64/minisign"
          sudo install -m 0755 "${workdir}/minisign-linux/x86_64/minisign" /usr/local/bin/minisign
          command -v minisign
          minisign -v
      - name: Sign checksums and immediately verify
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file=$(mktemp)
          trap 'rm -f "${key_file}"' EXIT
          printf '%s\n' "${MINISIGN_SECRET_KEY}" > "${key_file}"
          minisign -S -s "${key_file}" -m dist/SHA256SUMS -x dist/SHA256SUMS.minisig
          test -s dist/SHA256SUMS.minisig
          minisign -Vm dist/SHA256SUMS -p docs/release-keys/minisign.pub \
            -x dist/SHA256SUMS.minisig
          # Never echo key material.
          unset MINISIGN_SECRET_KEY
      - name: Build release body
        run: |
          set -euo pipefail
          cat > dist/RELEASE_BODY.md <<'EOF'
          > [!NOTE]
          > Portable checksums are signed with minisign (key ID `C596813EFB0946A4`).
          > Verify: `minisign -Vm SHA256SUMS -p minisign.pub` then `sha256sum -c SHA256SUMS`.
          > GitHub artifact provenance is available. Authenticode and Apple notarization remain unsupported (W-SIGN).

          EOF
          cat "docs/RELEASE_NOTES_${GITHUB_REF_NAME}.md" >> dist/RELEASE_BODY.md
      - name: Publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: OwnMesh ${{ github.ref_name }}
          body_path: dist/RELEASE_BODY.md
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/ownmesh-windows-x64.zip
            dist/ownmesh-macos-arm64.tar.gz
            dist/ownmesh-macos-x64.tar.gz
            dist/ownmesh-linux-x64.tar.gz
            dist/ownmesh-linux-arm64.tar.gz
            dist/ownmesh-*.sha256
            dist/ownmesh-installer.sh
            dist/ownmesh-installer.ps1
            dist/ownmesh.rb
            dist/minisign.pub
            dist/ownmesh-release-meta.json
            dist/ownmesh-release-evidence.json
            dist/sbom-*.cdx.json
            dist/SHA256SUMS
            dist/SHA256SUMS.minisig
