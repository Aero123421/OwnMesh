name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Reusable workflows are hard prerequisites. A failed/cancelled CI or Security
  # invocation leaves every build/publish job skipped by normal needs semantics.
  ci-gate:
    name: Required CI gate
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  security-gate:
    name: Required security gate
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security.yml

  build:
    name: Release build (${{ matrix.platform }})
    needs: [ci-gate, security-gate]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            binary_extension: .exe
          - platform: linux
            os: ubuntu-latest
            binary_extension: ""
          - platform: macos
            os: macos-latest
            binary_extension: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust 1.92 toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.92.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Verify tag, workspace version, and release notes
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)
          test "${GITHUB_REF_NAME}" = "v${version}"
          test -s "docs/RELEASE_NOTES_${GITHUB_REF_NAME}.md"
      - name: Build release binaries (locked)
        run: cargo build --release --workspace --locked
      - name: Package required binaries
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          EXT: ${{ matrix.binary_extension }}
        run: |
          set -euo pipefail
          staging="dist/ownmesh-${GITHUB_REF_NAME}-${PLATFORM}"
          mkdir -p "${staging}"
          for binary in ownmesh ownmesh-tui ownmeshd ownmesh-session-host ownmesh-broker; do
            source="target/release/${binary}${EXT}"
            test -s "${source}"
            cp "${source}" "${staging}/"
          done
          cp LICENSE NOTICE README.md "${staging}/"
          cp "docs/RELEASE_NOTES_${GITHUB_REF_NAME}.md" "${staging}/RELEASE_NOTES.md"
          test -s "${staging}/LICENSE"
          test -s "${staging}/NOTICE"
          test -s "${staging}/README.md"
          test -s "${staging}/RELEASE_NOTES.md"
          tar -C dist -czf "dist/ownmesh-${GITHUB_REF_NAME}-${PLATFORM}.tar.gz" \
            "ownmesh-${GITHUB_REF_NAME}-${PLATFORM}"
          test -s "dist/ownmesh-${GITHUB_REF_NAME}-${PLATFORM}.tar.gz"
      - name: Upload platform artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/ownmesh-${{ github.ref_name }}-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish gated release
    needs: [ci-gate, security-gate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download all platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Download strict SBOMs from Security gate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sbom-cyclonedx
          path: dist
      - name: Fail if any required artifact or current-tag notes are absent
        run: |
          set -euo pipefail
          test -s "docs/RELEASE_NOTES_${GITHUB_REF_NAME}.md"
          for platform in windows linux macos; do
            archive="dist/ownmesh-${GITHUB_REF_NAME}-${platform}.tar.gz"
            test -s "${archive}"
            listing=$(mktemp)
            trap 'rm -f "${listing}"' EXIT
            tar -tzf "${archive}" > "${listing}"
            grep -Fxq "ownmesh-${GITHUB_REF_NAME}-${platform}/LICENSE" "${listing}"
            grep -Fxq "ownmesh-${GITHUB_REF_NAME}-${platform}/NOTICE" "${listing}"
            grep -Fxq "ownmesh-${GITHUB_REF_NAME}-${platform}/README.md" "${listing}"
            grep -Fxq "ownmesh-${GITHUB_REF_NAME}-${platform}/RELEASE_NOTES.md" "${listing}"
            rm -f "${listing}"
            trap - EXIT
          done
          test -s dist/sbom-rust.cdx.json
          test -s dist/sbom-control-plane.cdx.json
          python3 - <<'PY'
          import json
          for path in ["dist/sbom-rust.cdx.json", "dist/sbom-control-plane.cdx.json"]:
              with open(path, encoding="utf-8") as handle:
                  data = json.load(handle)
              components = data.get("components")
              assert data.get("bomFormat") == "CycloneDX", path
              assert data.get("specVersion") == "1.5", path
              assert isinstance(data.get("version"), int) and data["version"] > 0, path
              assert isinstance(components, list) and components, f"empty SBOM: {path}"
              for component in components:
                  assert component.get("type") and component.get("name"), (path, component)
          PY
      - name: Generate checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum ownmesh-*.tar.gz sbom-*.cdx.json > SHA256SUMS
          test -s SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*
      - name: Determine signing mode
        id: signing
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -n "${MINISIGN_SECRET_KEY}" ] && [ -s docs/release-keys/minisign.pub ]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Install minisign
        if: steps.signing.outputs.available == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
      - name: Sign checksums
        if: steps.signing.outputs.available == 'true'
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key_file=$(mktemp)
          trap 'rm -f "${key_file}"' EXIT
          printf '%s\n' "${MINISIGN_SECRET_KEY}" > "${key_file}"
          minisign -S -s "${key_file}" -m dist/SHA256SUMS -x dist/SHA256SUMS.minisig
          test -s dist/SHA256SUMS.minisig
          minisign -Vm dist/SHA256SUMS -p docs/release-keys/minisign.pub \
            -x dist/SHA256SUMS.minisig
      - name: Build truthful release body
        env:
          SIGNED: ${{ steps.signing.outputs.available }}
        run: |
          set -euo pipefail
          if [ "${SIGNED}" = "true" ]; then
            cat > dist/RELEASE_BODY.md <<'EOF'
          > [!NOTE]
          > Portable checksums are signed with minisign. GitHub artifact provenance is available.
          > Authenticode and Apple notarization remain unsupported and are disclosed under W-SIGN.

          EOF
          else
            cat > dist/RELEASE_BODY.md <<'EOF'
          > [!WARNING]
          > **DEGRADED PRE-RELEASE:** a complete minisign key configuration (tracked public key + matching secret) was unavailable. Assets are unsigned.
          > SHA-256 checksums and non-empty CycloneDX SBOMs are attached. Provenance is available
          > through GitHub Artifact Attestations. None replaces artifact signing; W-SIGN remains open.

          EOF
          fi
          cat "docs/RELEASE_NOTES_${GITHUB_REF_NAME}.md" >> dist/RELEASE_BODY.md
      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: OwnMesh ${{ github.ref_name }}
          body_path: dist/RELEASE_BODY.md
          prerelease: ${{ steps.signing.outputs.available != 'true' }}
          fail_on_unmatched_files: true
          files: |
            dist/ownmesh-*.tar.gz
            dist/sbom-*.cdx.json
            dist/SHA256SUMS*
