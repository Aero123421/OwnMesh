name: PR 129 autofix and release resume

on:
  push:
    branches:
      - fix/resolve-open-issues-v1.2.17
    paths:
      - .github/workflows/pr129-autofix-resume.yml
  workflow_dispatch:

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write
  security-events: read

concurrency:
  group: pr129-release-controller
  cancel-in-progress: false

env:
  REPO: Aero123421/OwnMesh
  BRANCH: fix/resolve-open-issues-v1.2.17
  PR_NUMBER: "129"
  RELEASE_TAG: v1.2.17

jobs:
  autofix-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - name: Inspect completion state
        id: state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          merged="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.merged')"
          merge_sha="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.merge_commit_sha // ""')"
          if gh api "repos/$REPO/releases/tags/$RELEASE_TAG" >/dev/null 2>&1; then published=true; else published=false; fi
          echo "merged=$merged" >> "$GITHUB_OUTPUT"
          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"
          echo "published=$published" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.state.outputs.merged != 'true'
        with:
          ref: fix/resolve-open-issues-v1.2.17
          fetch-depth: 0

      - name: Install Rust 1.92 toolchain
        if: steps.state.outputs.merged != 'true'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.92.0"
          components: rustfmt, clippy

      - name: Cache Cargo
        if: steps.state.outputs.merged != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Apply only compiler-supported Rust fixes
        if: steps.state.outputs.merged != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr129-autofix-resume.yml
          rm -f .github/workflows/pr129-release-controller.yml
          rm -f .github/workflows/pr129-release-controller-retry.yml
          rm -f .github/workflows/materialize-pr-129.yml
          rm -f .github/workflows/source-export.yml
          rm -rf .github/patch .github/patch8
          cargo fmt --all
          cargo fix --workspace --all-targets --locked --allow-dirty --allow-staged || true
          cargo clippy --fix --workspace --all-targets --locked --allow-dirty --allow-staged -- -D warnings || true
          cargo fmt --all
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git config user.name "PHAITOTI"
            git config user.email "184829077+Aero123421@users.noreply.github.com"
            git commit -m "fix: apply compiler-supported cleanup for hardening changes"
            git push origin "HEAD:$BRANCH"
          fi

      - name: Linux preflight on clean merge candidate
        if: steps.state.outputs.merged != 'true'
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH" main --quiet
          git checkout --detach "origin/$BRANCH"
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          test ! -e .github/patch
          test ! -e .github/patch8
          test ! -e .github/workflows/pr129-autofix-resume.yml
          test "$(git diff --name-only origin/main...HEAD | sed '/^$/d' | wc -l)" -ge 5
          grep -Eq '^version = "1\.2\.17"$' Cargo.toml
          grep -q 'SERVICE_VERSION = "1.2.17"' packages/control-plane/src/util.ts
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo build --workspace --locked
          cargo test --workspace --all-targets --locked --exclude ownmesh-session-host --exclude ownmeshd
          python scripts/check_release_quality.py

      - name: Dispatch official cross-platform gates
        if: steps.state.outputs.merged != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run ci.yml --repo "$REPO" --ref "$BRANCH"
          gh workflow run security.yml --repo "$REPO" --ref "$BRANCH"

      - name: Wait for exact candidate gates
        if: steps.state.outputs.merged != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          wait_for() {
            local file="$1" label="$2" wid rid status conclusion
            wid="$(gh api "repos/$REPO/actions/workflows/$file" --jq '.id')"
            rid=""
            for _ in $(seq 1 90); do
              rid="$(gh api --method GET "repos/$REPO/actions/workflows/$wid/runs" -f branch="$BRANCH" -f event=workflow_dispatch -f per_page=30 --jq ".workflow_runs | map(select(.head_sha == \"$SHA\")) | sort_by(.created_at) | last | .id // empty")"
              [ -n "$rid" ] && break
              sleep 10
            done
            test -n "$rid"
            echo "$label: https://github.com/$REPO/actions/runs/$rid" >> "$GITHUB_STEP_SUMMARY"
            for _ in $(seq 1 240); do
              status="$(gh api "repos/$REPO/actions/runs/$rid" --jq '.status')"
              conclusion="$(gh api "repos/$REPO/actions/runs/$rid" --jq '.conclusion // ""')"
              if [ "$status" = completed ]; then
                if [ "$conclusion" = success ]; then return 0; fi
                gh run view "$rid" --repo "$REPO" --log-failed || true
                return 1
              fi
              sleep 20
            done
            return 1
          }
          wait_for ci.yml CI
          wait_for security.yml Security

      - name: Merge exact tested candidate
        if: steps.state.outputs.merged != 'true'
        id: merged_now
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.sha')" = "$SHA"
          if [ "$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.draft')" = true ]; then gh pr ready "$PR_NUMBER" --repo "$REPO"; fi
          gh pr merge "$PR_NUMBER" --repo "$REPO" --squash --delete-branch=false --match-head-commit "$SHA"
          test "$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.merged')" = true
          echo "sha=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.merge_commit_sha')" >> "$GITHUB_OUTPUT"

      - name: Resolve merge SHA
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.state.outputs.merged }}" = true ]; then sha="${{ steps.state.outputs.merge_sha }}"; else sha="${{ steps.merged_now.outputs.sha }}"; fi
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.state.outputs.published != 'true'
        with:
          ref: main
          fetch-depth: 0

      - name: Create or verify release tag
        if: steps.state.outputs.published != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ steps.merge.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin main --tags --quiet
          test "$(git rev-parse origin/main)" = "$MERGE_SHA"
          git checkout --detach "$MERGE_SHA"
          grep -Eq '^version = "1\.2\.17"$' Cargo.toml
          grep -q 'SERVICE_VERSION = "1.2.17"' packages/control-plane/src/util.ts
          grep -q 'v1.2.17' CHANGELOG.md
          python scripts/check_release_quality.py
          if gh api "repos/$REPO/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh api "repos/$REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')" = "$MERGE_SHA"
          else
            gh api --method POST "repos/$REPO/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$MERGE_SHA" >/dev/null
          fi

      - name: Dispatch signed release and verify assets
        if: steps.state.outputs.published != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ steps.merge.outputs.sha }}
        run: |
          set -euo pipefail
          wid="$(gh api "repos/$REPO/actions/workflows/release.yml" --jq '.id')"
          gh api --method POST "repos/$REPO/actions/workflows/$wid/dispatches" -f ref="$RELEASE_TAG"
          rid=""
          for _ in $(seq 1 90); do
            rid="$(gh api --method GET "repos/$REPO/actions/workflows/$wid/runs" -f event=workflow_dispatch -f per_page=30 --jq ".workflow_runs | map(select(.head_sha == \"$MERGE_SHA\")) | sort_by(.created_at) | last | .id // empty")"
            [ -n "$rid" ] && break
            sleep 10
          done
          test -n "$rid"
          echo "Release: https://github.com/$REPO/actions/runs/$rid" >> "$GITHUB_STEP_SUMMARY"
          for _ in $(seq 1 300); do
            status="$(gh api "repos/$REPO/actions/runs/$rid" --jq '.status')"
            conclusion="$(gh api "repos/$REPO/actions/runs/$rid" --jq '.conclusion // ""')"
            if [ "$status" = completed ]; then
              if [ "$conclusion" = success ]; then break; fi
              gh run view "$rid" --repo "$REPO" --log-failed || true
              exit 1
            fi
            sleep 20
          done
          test "$(gh api "repos/$REPO/actions/runs/$rid" --jq '.conclusion')" = success
          release="$(gh api "repos/$REPO/releases/tags/$RELEASE_TAG")"
          test "$(jq -r '.draft' <<<"$release")" = false
          test "$(jq -r '.prerelease' <<<"$release")" = false
          test "$(jq '.assets | length' <<<"$release")" -gt 0

      - name: Success note
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "$PR_NUMBER" --repo "$REPO" --body "Autofix/resume gate completed successfully. Exact candidate CI and Security passed; PR merged; $RELEASE_TAG and signed release assets are published."

      - name: Failure note
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "$PR_NUMBER" --repo "$REPO" --body "Autofix/resume stopped fail-closed. No merge or release step after the failure was executed. Run: https://github.com/$REPO/actions/runs/$GITHUB_RUN_ID"
