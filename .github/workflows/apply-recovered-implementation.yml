name: Materialize recovered implementation

on:
  push:
    branches:
      - fix/resolve-open-issues-v1.2.17
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: fix/resolve-open-issues-v1.2.17

      - name: Decode and apply implementation patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import gzip

          candidates = []
          for directory in (Path('.github/patch8'), Path('.github/patch')):
              parts = sorted(directory.glob('part-*')) if directory.exists() else []
              if not parts:
                  continue
              encoded = ''.join(part.read_text(encoding='utf-8').strip() for part in parts)
              try:
                  payload = base64.b64decode(encoded, validate=True)
                  if payload.startswith(b'\x1f\x8b'):
                      payload = gzip.decompress(payload)
                  text = payload.decode('utf-8')
              except Exception:
                  continue
              if 'diff --git ' in text:
                  candidates.append((directory.name == 'patch8', len(text), text))

          if not candidates:
              raise SystemExit('no valid recovered implementation patch found')
          candidates.sort(reverse=True)
          Path('/tmp/ownmesh-recovered.patch').write_text(candidates[0][2], encoding='utf-8')
          PY
          git apply --check /tmp/ownmesh-recovered.patch
          git apply /tmp/ownmesh-recovered.patch
          rm -rf .github/patch .github/patch8
          rm -f .github/workflows/source-export.yml
          rm -f .github/workflows/apply-recovered-implementation.yml
          git diff --check

      - name: Commit materialized source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Aero123421"
          git config user.email "184829077+Aero123421@users.noreply.github.com"
          git add -A
          git commit -m "fix: resolve remaining reliability and security hardening issues" \
            -m "Materialize the reviewed OAuth, diagnostics, updater, archive, support-bundle, and privileged-ledger changes for the v1.2.17 train."
          git push origin HEAD:fix/resolve-open-issues-v1.2.17
