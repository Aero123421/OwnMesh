name: Temporary source export

on:
  push:
    branches:
      - fix/resolve-open-issues-v1.2.17
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Package source snapshot
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git -czf "$RUNNER_TEMP/ownmesh-source.tar.gz" .
      - name: Upload source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ownmesh-source
          path: ${{ runner.temp }}/ownmesh-source.tar.gz
          if-no-files-found: error
          retention-days: 1
