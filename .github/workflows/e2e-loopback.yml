name: E2E loopback (nightly)

# Real-binary × local workerd suites exercise the agent → control-plane →
# device path that unit tests stub out. They are slower and depend on workerd
# starting locally, so they run on a schedule and on demand rather than as a
# PR merge gate. A failure here is not a merge gate, but a blocking signal
# that requires triage (see the triage job below and docs/ci-test-tiers.md
# "Nightly/weekly ownership"); "PR passed so ignore" is forbidden.
#
# Responsibility boundary vs scale.yml (Issue #230):
# - this workflow: multi-process E2E with real binaries + local workerd.
# - scale.yml: production-boundary scale/soak (large FS/output/concurrency).
# Release candidate E2E (release.yml) reuses exact packaged binaries via
# OWNMESH_E2E_ARTIFACT_DIR and never rebuilds the workspace inside the job.

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

concurrency:
  group: e2e-loopback-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workerd-loopback:
    name: Real binaries against local workerd
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.92 toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.92.0"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: e2e-loopback

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Enable corepack (pnpm 9.15.0)
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: pnpm install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build workspace binaries
        run: cargo build --workspace --locked

      - name: E1 + E2/E3 workerd loopback suite
        timeout-minutes: 30
        run: python scripts/tests/run_e2e_loopback_tests.py

      - name: E9 resumable transfer loopback
        timeout-minutes: 20
        run: python scripts/tests/test_e9_workerd_transfer.py

  # Failure triage is notification-only (no secrets, no issue write).
  # On failure it publishes owner/due/Issue-template to the step summary
  # and exposes them as job outputs for branch protection / dashboards.
  # See docs/ci-test-tiers.md "Nightly/weekly ownership".
  triage:
    name: E2E failure triage (blocking signal)
    needs: [workerd-loopback]
    if: failure()
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.triage.outputs.owner }}
      due: ${{ steps.triage.outputs.due }}
      issue_title: ${{ steps.triage.outputs.issue_title }}
    steps:
      - id: triage
        shell: bash
        run: |
          set -euo pipefail
          echo 'owner=@Aero123421' >> "$GITHUB_OUTPUT"
          echo 'due=triage within 1 business day' >> "$GITHUB_OUTPUT"
          echo 'issue_title=[e2e-loopback] nightly failure needs triage' >> "$GITHUB_OUTPUT"
          {
            echo "## E2E loopback failure triage (blocking, owner required)"
            echo ""
            echo "- Owner: @Aero123421 (per .github/CODEOWNERS; docs/ci-test-tiers.md nightly/weekly ownership)"
            echo "- Due: triage within 1 business day; file an Issue before any retry or quarantine"
            echo "- Issue template: title \`[e2e-loopback] <date> failure\`, body links this run URL"
            echo "- Issue fields: owner, expiry (for quarantine only), nightly execution required"
            echo "- Quarantine: prohibited by default; never applies to security/release gates"
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
