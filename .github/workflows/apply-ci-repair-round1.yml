name: Apply CI repair round 1

on:
  push:
    branches:
      - fix/resolve-open-issues-v1.2.17
    paths:
      - .github/ci-repair-round1.patch
      - .github/workflows/apply-ci-repair-round1.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/resolve-open-issues-v1.2.17
          fetch-depth: 0

      - name: Install Rust 1.92 formatter
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: '1.92.0'
          components: rustfmt

      - name: Apply reviewed repair and format Rust
        shell: bash
        run: |
          set -euo pipefail
          git apply --index .github/ci-repair-round1.patch
          cargo fmt --all
          node --experimental-strip-types --check packages/control-plane/src/util.ts
          node --experimental-strip-types --check packages/control-plane/src/store.ts
          python - <<'PY'
          from pathlib import Path
          import sqlite3
          db = sqlite3.connect(':memory:')
          for migration in sorted(Path('packages/control-plane/migrations').glob('*.sql')):
              db.executescript(migration.read_text())
          columns = {row[1] for row in db.execute('pragma table_info(oauth_tokens)')}
          indexes = {row[1] for row in db.execute("pragma index_list('oauth_tokens')")}
          assert 'auth_code_hash' in columns
          assert 'idx_oauth_tokens_auth_code_hash' in indexes
          PY
          git diff --check

      - name: Remove temporary patch transport and repair workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/ci-repair-round1.patch \
            .github/fix-round1.patch \
            .github/v1.2.17-ci-trigger \
            .github/workflows/apply-ci-repair-round1.yml \
            .github/workflows/apply-fix-round1.yml \
            .github/workflows/apply-recovered-implementation.yml \
            .github/workflows/v1.2.17-final-gate.yml \
            .github/workflows/v1.2.17-hardening-validation.yml \
            .github/workflows/ci-source-snapshot.yml

      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name 'PHAITOTI'
          git config user.email '184829077+Aero123421@users.noreply.github.com'
          git commit -m 'fix(ci): complete OAuth migration and unblock hardening gates'
          git push origin HEAD:fix/resolve-open-issues-v1.2.17
