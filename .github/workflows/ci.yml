name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust 1.92 (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            workspace_test_args: ""
          - name: macOS
            os: macos-latest
            workspace_test_args: ""
          - name: Linux
            os: ubuntu-latest
            workspace_test_args: "--exclude ownmesh-session-host --exclude ownmeshd"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.92 toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.92.0"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # cargo-fmt does not accept Cargo's --locked flag because it never resolves
      # dependencies. Lockfile immutability is checked explicitly before formatting.
      - name: Verify Cargo.lock is current
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null
        shell: bash

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo build
        run: cargo build --workspace --locked

      - name: cargo test
        run: cargo test --workspace --all-targets --locked ${{ matrix.workspace_test_args }}

      - name: Enforce Windows foreign-owner custody regression
        if: matrix.os == 'windows-latest'
        run: >-
          cargo test --locked -p ownmesh-ipc
          windows_rejects_foreign_owned_state_directory_before_hardening
          -- --ignored

      - name: Windows portable installer integration
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/jedisct1/minisign/releases/download/0.11/minisign-0.11-win64.zip"
          $archive = Join-Path $env:RUNNER_TEMP "minisign-0.11-win64.zip"
          $extract = Join-Path $env:RUNNER_TEMP "minisign-0.11-win64"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          $expected = "b9c31c2c3034f81f0e5f5d92cbcc20e67a9671b6e5455661588638848dc58031"
          if ($actual -ne $expected) {
            throw "pinned minisign bootstrap SHA-256 mismatch"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $extract
          $minisignDir = Join-Path $extract "minisign-win64"
          $minisign = Join-Path $minisignDir "minisign.exe"
          if (-not (Test-Path -LiteralPath $minisign -PathType Leaf)) {
            throw "pinned minisign.exe missing"
          }
          $env:PATH = "$minisignDir;$env:PATH"
          python scripts/tests/test_installers.py

  linux-stateful:
    name: Rust 1.92 (Linux stateful)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.92 toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.92.0"

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # The daemon integration targets path-include runtime.rs. Run those unit
      # tests once, then run only each integration target's own tests.
      - name: Daemon unit tests
        run: cargo test -p ownmeshd --bin ownmeshd --locked

      - name: Daemon adversarial integration tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p ownmeshd --test adversarial_security --locked -- --skip 'runtime::'
          cargo test -p ownmeshd --test lease_expiry --locked -- --skip 'runtime::'
          cargo test -p ownmeshd --test persist_rollback --locked -- --skip 'runtime::'

      - name: Daemon platform integration tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p ownmeshd --test broker_capability_forgery --locked
          cargo test -p ownmeshd --test platform_endpoint_security --locked

      - name: PTY lifecycle tests (serialized)
        run: cargo test -p ownmesh-session-host --all-targets --locked -- --test-threads=1

  typescript:
    name: pnpm frozen quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Enable corepack (pnpm 9.15.0)
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: pnpm install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: pnpm tests
        run: pnpm -r test

      - name: pnpm typecheck
        run: pnpm -r typecheck

      - name: pnpm lint
        run: pnpm -r lint

      - name: Wrangler configuration dry-run
        working-directory: packages/control-plane
        run: pnpm exec wrangler deploy --dry-run

  release-truthfulness:
    name: Release claims and gate structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Minisign for Unix installer integration
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/jedisct1/minisign/releases/download/0.11/minisign-0.11-linux.tar.gz"
          archive="$RUNNER_TEMP/minisign-0.11-linux.tar.gz"
          extract="$RUNNER_TEMP/minisign-0.11-linux"
          tools="$RUNNER_TEMP/ownmesh-tools"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --retry 3 --max-redirs 5 --output "$archive" "$url"
          echo "f0a0954413df8531befed169e447a66da6868d79052ed7e892e50a4291af7ae0  $archive" |
            sha256sum --check --strict
          mkdir -p "$extract" "$tools"
          tar -xzf "$archive" -C "$extract"
          install -m 0755 "$extract/minisign-linux/x86_64/minisign" "$tools/minisign"
          "$tools/minisign" -v
          echo "$tools" >> "$GITHUB_PATH"
      - name: Unix portable installer integration
        run: python scripts/tests/test_installers.py
      - name: Verify release surfaces and fail-closed publish graph
        run: python scripts/check_release_quality.py
      - name: Release-quality checker fixtures and mutation tests
        run: python scripts/tests/run_release_quality_tests.py

  tui-i18n:
    name: TUI i18n completeness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.92 toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.92.0"

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Translation completeness (en-US / ja-JP / zh-Hans / ru-RU)
        run: cargo run --locked -p ownmesh-tui -- --check-i18n

      - name: TUI snapshot tests (CJK width, ru overflow, 80x24, wizard)
        run: cargo test --locked -p ownmesh-tui -- --nocapture
