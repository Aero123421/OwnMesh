name: Security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-dependency-audit:
    name: Rust dependency audit (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.92 toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit (blocking)
        run: |
          set -euo pipefail
          cargo audit --json | tee cargo-audit.json
      - name: Upload cargo-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-audit-report
          path: cargo-audit.json
          if-no-files-found: ignore
          retention-days: 30

  js-dependency-audit:
    name: JS dependency audit (pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable corepack (pnpm 9.15.0)
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
      - name: pnpm install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: pnpm audit (high and critical are blocking)
        run: pnpm audit --audit-level=high

  sast-rust:
    name: SAST (Rust 1.92 clippy -D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.92 toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy (workspace, all targets, locked)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  sast-typescript:
    name: SAST (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable corepack (pnpm 9.15.0)
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
      - name: pnpm install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Typecheck all packages
        run: pnpm -r typecheck
      - name: Lint all packages
        run: pnpm -r lint

  secret-scanning:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"

  sbom:
    name: SBOM (strict CycloneDX Rust + Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.92 toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable corepack (pnpm 9.15.0)
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
      - name: pnpm install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Generate Rust workspace SBOM (validated, no fallback)
        run: |
          set -euo pipefail
          rm -rf sbom
          mkdir sbom
          pnpm dlx @cyclonedx/cdxgen@11.0.1 -t rust --no-install-deps --fail-on-error --validate \
            -o sbom/sbom-rust.cdx.json --spec-version 1.5 .
      - name: Generate control-plane SBOM via cdxgen (validated, no fallback)
        run: |
          set -euo pipefail
          pnpm dlx @cyclonedx/cdxgen@11.0.1 -t pnpm --no-install-deps --fail-on-error --validate \
            -o sbom/sbom-control-plane.cdx.json --spec-version 1.5 .
      - name: Validate non-empty CycloneDX structure
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          for path in ["sbom/sbom-rust.cdx.json", "sbom/sbom-control-plane.cdx.json"]:
              with open(path, encoding="utf-8") as handle:
                  data = json.load(handle)
              assert data.get("bomFormat") == "CycloneDX", path
              assert data.get("specVersion") == "1.5", path
              assert isinstance(data.get("version"), int) and data["version"] > 0, path
              components = data.get("components")
              assert isinstance(components, list) and components, f"empty SBOM: {path}"
              for component in components:
                  assert component.get("type") and component.get("name"), (path, component)
              print(path, "validated components=", len(components))
          PY
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 90

  audit-retention-and-redaction:
    name: Audit retention + redaction invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.92 toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable corepack (pnpm 9.15.0)
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
      - name: pnpm install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Rust privacy / redaction / relay / Full Access invariants
        run: >-
          cargo test --locked
          -p ownmesh-diagnostics -p ownmesh-config -p ownmesh-update
          -p ownmesh-transfer -p ownmesh-policy -p ownmesh-identity
          -- --nocapture
      - name: Control-plane security hardening tests
        run: pnpm --filter @ownmesh/control-plane test
      - name: Confirm telemetry/relay defaults remain OFF in source schema
        run: |
          set -euo pipefail
          grep -nE 'project:\s*false|crash_upload:\s*false|usage_analytics:\s*false|relay_enabled:\s*false|telemetry_enabled:\s*false' \
            crates/ownmesh-config/src/schema.rs \
            crates/ownmesh-transfer/src/lib.rs \
            crates/ownmesh-update/src/lib.rs \
            crates/ownmesh-diagnostics/src/lib.rs

  release-policy:
    name: Release cannot bypass CI or security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/check_release_quality.py
