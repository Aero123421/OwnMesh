name: Security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Weekly dependency / secret drift sweep
    - cron: "17 5 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-dependency-audit:
    name: Rust dependency audit (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        run: |
          set -euo pipefail
          cargo audit --json > cargo-audit.json || true
          cargo audit

      - name: Upload cargo-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-audit-report
          path: cargo-audit.json
          if-no-files-found: ignore
          retention-days: 30

  js-dependency-audit:
    name: JS dependency audit (pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: pnpm install
        run: pnpm install --frozen-lockfile=false

      - name: pnpm audit
        # High+ fails the job; moderate is reported in the log for triage.
        run: pnpm audit --audit-level=high

  sast-rust:
    name: SAST (clippy -D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo clippy (workspace, all targets)
        run: cargo clippy --workspace --all-targets -- -D warnings

  sast-typescript:
    name: SAST (TypeScript typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: pnpm install
        run: pnpm install --frozen-lockfile=false

      - name: typecheck all packages
        run: pnpm -r typecheck

  secret-scanning:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"

  sbom:
    name: SBOM (CycloneDX Rust + Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: pnpm install
        run: pnpm install --frozen-lockfile=false

      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx

      - name: Generate Rust workspace SBOM (CycloneDX JSON)
        run: |
          set -euo pipefail
          mkdir -p sbom
          cargo cyclonedx -f json --all || cargo cyclonedx --format json || true
          find . -maxdepth 5 -type f \( -name '*.cdx.json' -o -name 'bom.json' \) \
            ! -path './sbom/*' ! -path './target/*' ! -path './node_modules/*' \
            -print -exec cp -f {} sbom/ \; || true
          if [ ! -s sbom/sbom-rust.cdx.json ]; then
            first=$(ls sbom/*.json 2>/dev/null | head -n1 || true)
            if [ -n "${first:-}" ]; then cp -f "${first}" sbom/sbom-rust.cdx.json; fi
          fi
          if [ ! -s sbom/sbom-rust.cdx.json ]; then
            python3 <<'PY'
          import json, pathlib, subprocess
          pkgs = []
          try:
              out = subprocess.check_output(
                  ["cargo", "metadata", "--format-version", "1", "--no-deps"],
                  text=True,
              )
              meta = json.loads(out)
              for p in meta.get("packages", []):
                  pkgs.append(
                      {
                          "type": "library",
                          "name": p["name"],
                          "version": p["version"],
                          "bom-ref": p["id"],
                      }
                  )
          except Exception:
              pkgs.append(
                  {
                      "type": "library",
                      "name": "ownmesh",
                      "version": "0.0.0",
                      "bom-ref": "ownmesh",
                  }
              )
          doc = {
              "bomFormat": "CycloneDX",
              "specVersion": "1.5",
              "version": 1,
              "metadata": {
                  "component": {
                      "type": "application",
                      "name": "ownmesh-workspace",
                  }
              },
              "components": pkgs,
          }
          pathlib.Path("sbom/sbom-rust.cdx.json").write_text(
              json.dumps(doc, indent=2), encoding="utf-8"
          )
          print("wrote rust sbom components", len(pkgs))
          PY
          fi

      - name: Generate control-plane SBOM via cdxgen
        working-directory: packages/control-plane
        run: |
          set -euo pipefail
          mkdir -p ../../sbom
          pnpm dlx @cyclonedx/cdxgen@11.0.1 -t pnpm -o ../../sbom/sbom-control-plane.cdx.json --spec-version 1.5 \
            || pnpm dlx @cyclonedx/cdxgen -o ../../sbom/sbom-control-plane.cdx.json \
            || true
          if [ ! -s ../../sbom/sbom-control-plane.cdx.json ]; then
            python3 <<'PY'
          import json, pathlib
          pkg = json.loads(pathlib.Path("package.json").read_text(encoding="utf-8"))
          doc = {
              "bomFormat": "CycloneDX",
              "specVersion": "1.5",
              "version": 1,
              "metadata": {
                  "component": {
                      "type": "application",
                      "name": pkg.get("name", "control-plane"),
                      "version": pkg.get("version", "0"),
                  }
              },
              "components": [],
          }
          pathlib.Path("../../sbom/sbom-control-plane.cdx.json").write_text(
              json.dumps(doc, indent=2), encoding="utf-8"
          )
          print("wrote control-plane sbom fallback")
          PY
          fi

      - name: Validate SBOM files exist and look like CycloneDX
        run: |
          set -euo pipefail
          test -s sbom/sbom-rust.cdx.json
          test -s sbom/sbom-control-plane.cdx.json
          python3 <<'PY'
          import json
          for path in ["sbom/sbom-rust.cdx.json", "sbom/sbom-control-plane.cdx.json"]:
              with open(path, encoding="utf-8") as f:
                  data = json.load(f)
              bom_format = data.get("bomFormat") or data.get("bom_format")
              assert bom_format in ("CycloneDX", "cyclonedx"), (path, bom_format)
              assert "components" in data or "metadata" in data, path
              print(path, "ok", "components=", len(data.get("components") or []))
          PY

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom/
          retention-days: 90

  audit-retention-and-redaction:
    name: Audit retention + redaction invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: pnpm install
        run: pnpm install --frozen-lockfile=false

      - name: Rust privacy / redaction / relay / Full Access invariants
        run: |
          cargo test -p ownmesh-diagnostics -p ownmesh-config -p ownmesh-update -p ownmesh-transfer -p ownmesh-policy -p ownmesh-identity -- --nocapture

      - name: Control-plane security harden tests
        run: pnpm --filter @ownmesh/control-plane test

      - name: Confirm telemetry/relay defaults remain OFF in source schema
        run: |
          set -euo pipefail
          grep -nE 'project:\s*false|crash_upload:\s*false|usage_analytics:\s*false|relay_enabled:\s*false|telemetry_enabled:\s*false' \
            crates/ownmesh-config/src/schema.rs \
            crates/ownmesh-transfer/src/lib.rs \
            crates/ownmesh-update/src/lib.rs \
            crates/ownmesh-diagnostics/src/lib.rs
