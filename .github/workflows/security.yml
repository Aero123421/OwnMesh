name: Security

# Deep / scheduled security (Issue #230 Phase 3, ADR 0022).
# PR-time fast subset lives in ci.yml `security-fast` (changed-range gitleaks
# + affected boundary tests). This workflow never runs on PRs so the same
# clippy/typecheck/lint/tests are not executed twice for one SHA.
#
# - weekly schedule: new advisories, full-history secrets, strict SBOM, full
#   adversarial/fuzz corpus, retention/redaction invariants.
# - main lockfile pushes: dependency audits only (fast signal on new deps).
# - manual dispatch: full deep suite.

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "Cargo.lock"
      - "pnpm-lock.yaml"
      - "Cargo.toml"
      - "package.json"
      - "packages/*/package.json"

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-dependency-audit:
    name: Rust dependency audit (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.92 toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.92.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-audit
        uses: taiki-e/install-action@91ddec75689c4c78665b598d188dc821c5a43e5c # v2
        with:
          tool: cargo-audit@0.22.2
      - name: cargo audit (blocking)
        run: |
          set -euo pipefail
          cargo audit --json | tee cargo-audit.json
      - name: Upload cargo-audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cargo-audit-report
          path: cargo-audit.json
          if-no-files-found: ignore
          retention-days: 30

  js-dependency-audit:
    name: JS dependency audit (pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Enable corepack (pnpm 9.15.0)
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
      - name: pnpm install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: pnpm audit (high and critical are blocking)
        run: pnpm audit --audit-level=high

  secret-scanning-full-history:
    name: Secret scanning (full history)
    runs-on: ubuntu-latest
    # Weekly full-history scan. PRs get changed-range scan in ci.yml security-fast.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks (full history)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"

  sbom-weekly:
    name: SBOM weekly (strict CycloneDX)
    # Weekly continuous audit. Release assets use an exact-tag-SHA SBOM
    # regenerated in release.yml (missing/invalid fails publish).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.92 toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.92.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Enable corepack (pnpm 9.15.0)
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
      - name: pnpm install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Generate Rust workspace SBOM (validated, no fallback)
        run: |
          set -euo pipefail
          rm -rf sbom
          mkdir sbom
          pnpm dlx @cyclonedx/cdxgen@11.0.1 -t rust --no-install-deps --fail-on-error --validate \
            -o sbom/sbom-rust.cdx.json --spec-version 1.5 .
      - name: Generate control-plane SBOM via cdxgen (validated, no fallback)
        run: |
          set -euo pipefail
          pnpm dlx @cyclonedx/cdxgen@11.0.1 -t pnpm --no-install-deps --fail-on-error --validate \
            -o sbom/sbom-control-plane.cdx.json --spec-version 1.5 .
      - name: Validate non-empty CycloneDX structure
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          for path in ["sbom/sbom-rust.cdx.json", "sbom/sbom-control-plane.cdx.json"]:
              with open(path, encoding="utf-8") as handle:
                  data = json.load(handle)
              assert data.get("bomFormat") == "CycloneDX", path
              assert data.get("specVersion") == "1.5", path
              assert isinstance(data.get("version"), int) and data["version"] > 0, path
              components = data.get("components")
              assert isinstance(components, list) and components, f"empty SBOM: {path}"
              for component in components:
                  assert component.get("type") and component.get("name"), (path, component)
              print(path, "validated components=", len(components))
          PY
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-cyclonedx-weekly
          path: sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 90

  deep-adversarial:
    name: Deep adversarial + privacy invariants (weekly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.92 toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.92.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Enable corepack (pnpm 9.15.0)
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
      - name: pnpm install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Full Rust privacy / redaction invariants
        run: >-
          cargo test --locked
          -p ownmesh-diagnostics -p ownmesh-config -p ownmesh-update
          -p ownmesh-transfer -p ownmesh-policy -p ownmesh-identity
          -- --nocapture
      - name: Full control-plane hardening tests
        run: pnpm --filter @ownmesh/control-plane test
      - name: Confirm telemetry/relay/update-network defaults remain OFF
        run: >-
          cargo test --locked
          -p ownmesh-config --test privacy_defaults
          -p ownmesh-update --test privacy_defaults
          -p ownmesh-diagnostics --test privacy_and_redaction
          -- --nocapture
