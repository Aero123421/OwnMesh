# OwnMesh Full Access preset — no hidden hard deny for user-chosen capability.
# Invalid signatures, expired tokens, protocol violations, and OS denials still fail.

preset = "full_access"
default_decision = "allow"

# Empty rules: preset default is allow for all classified operations, including
# elevated and raw shell. Users may still add explicit ask/deny rules below.

