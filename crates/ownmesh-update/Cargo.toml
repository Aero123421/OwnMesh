[package]
name = "ownmesh-update"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Signed OwnMesh release verification, download, and atomic install"
readme = "README.md"

[lints]
workspace = true

[dependencies]
flate2 = "1.0.35"
hex = "0.4"
minisign-verify = "0.2.4"
ownmesh-persist = { path = "../ownmesh-persist" }
semver = "1.0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4.43"
tempfile = "3.15.0"
thiserror = "2"
url = "2.5.4"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2.2.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
flate2 = "1.0.35"
minisign = "0.9"
serde_json = "1"
tar = "0.4.43"
tempfile = "3.15.0"
zip = { version = "2.2.2", default-features = false, features = ["deflate"] }
