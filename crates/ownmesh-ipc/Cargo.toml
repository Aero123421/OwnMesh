[package]
name = "ownmesh-ipc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "OwnMesh local IPC transport (named pipes / unix sockets)"
readme = "README.md"

# Windows named-pipe peer PID/exe requires a tiny FFI surface (GetNamedPipeClientProcessId).
# Package cannot inherit workspace `unsafe_code = forbid` while allowing that FFI.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[dependencies]
bytes = "1.9.0"
ownmesh-domain = { path = "../ownmesh-domain" }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
sha2 = "0.10.8"
subtle = "2"
tokio = { version = "1.43.0", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }
tracing = "0.1.41"
uuid = { version = "1.12.1", features = ["serde", "v4"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["fs", "process"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Services",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.15.0"
tokio = { version = "1.43.0", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }
