[package]
name = "ownmesh-session-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "OwnMesh detached session host (PTY supervisor)"
readme = "README.md"

[lib]
name = "ownmesh_session_host"
path = "src/lib.rs"

[[bin]]
name = "ownmesh-session-host"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4.5.27", features = ["derive"] }
crossterm = "0.28.1"
ownmesh-config = { path = "../ownmesh-config" }
ownmesh-domain = { path = "../ownmesh-domain" }
ownmesh-exec = { path = "../ownmesh-exec" }
ownmesh-ipc = { path = "../ownmesh-ipc" }
ownmesh-session = { path = "../ownmesh-session" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1.43.0", features = [
    "fs",
    "io-util",
    "macros",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
uuid = { version = "1.12.1", features = ["v4"] }

# portable-pty 0.9 clears inherited Unix signal masks, which Darwin teardown
# requires. On Windows 0.9 also enables PSEUDOCONSOLE_INHERIT_CURSOR; ConPTY
# then blocks unattended sessions on an ESC[6n cursor-position handshake.
[target.'cfg(not(windows))'.dependencies]
portable-pty = "=0.9.0"

[target.'cfg(windows)'.dependencies]
portable-pty = "=0.8.1"

[dev-dependencies]
tempfile = "3.15.0"
