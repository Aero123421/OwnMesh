[package]
name = "ownmesh-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "OwnMesh terminal user interface"
readme = "README.md"

[[bin]]
name = "ownmesh-tui"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
# `env` backs `--lang`'s OWNMESH_LANG binding. Declared here rather than
# inherited: workspace feature unification supplies it during a full-workspace
# build, but `cargo run -p ownmesh-tui` compiles this crate alone.
clap = { version = "4.5.27", features = ["derive", "env"] }
crossterm = "0.28.1"
anyhow = "1.0.95"
ownmesh-config = { path = "../ownmesh-config" }
ownmesh-diagnostics = { path = "../ownmesh-diagnostics" }
ownmesh-domain = { path = "../ownmesh-domain" }
ownmesh-identity = { path = "../ownmesh-identity" }
ownmesh-ipc = { path = "../ownmesh-ipc" }
ownmesh-policy = { path = "../ownmesh-policy" }
ownmesh-profiles = { path = "../ownmesh-profiles" }
ownmesh-transfer = { path = "../ownmesh-transfer" }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.12.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
tokio = { version = "1.43.0", features = [
    "macros",
    "rt-multi-thread",
    "time",
] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
unicode-width = "0.2.0"

[dev-dependencies]
tempfile = "3.15.0"
