[package]
name = "ownmesh-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "OwnMesh terminal user interface"
readme = "README.md"

[[bin]]
name = "ownmesh-tui"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4.5.27", features = ["derive"] }
crossterm = "0.28.1"
ownmesh-config = { path = "../ownmesh-config" }
ownmesh-domain = { path = "../ownmesh-domain" }
ownmesh-ipc = { path = "../ownmesh-ipc" }
ratatui = "0.29.0"
serde_json = "1.0.135"
tokio = { version = "1.43.0", features = [
    "macros",
    "rt-multi-thread",
    "time",
] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.15.0"
