[package]
name = "ownmesh-broker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "ownmesh-broker"
readme = "README.md"

[lints.rust]
# Native Windows SCM and token APIs are isolated to windows_lifecycle.rs.
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[[bin]]
name = "ownmesh-broker"
path = "src/main.rs"

[dependencies]
ownmesh-broker-client = { path = "../ownmesh-broker-client" }
ownmesh-domain = { path = "../ownmesh-domain" }
ownmesh-exec = { path = "../ownmesh-exec" }
ownmesh-ipc = { path = "../ownmesh-ipc" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
fs2 = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "process",
    "io-util",
    "time",
    "sync",
    "net",
    "fs",
] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["process", "fs"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Services",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_System_Pipes",
] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
