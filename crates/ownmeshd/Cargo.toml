[package]
name = "ownmeshd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "OwnMesh user-level device agent daemon"
readme = "README.md"

[[bin]]
name = "ownmeshd"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4.5.27", features = ["derive", "env", "wrap_help"] }
futures-util = { version = "0.3.31", default-features = false, features = ["sink", "std"] }
ownmesh-broker-client = { path = "../ownmesh-broker-client" }
ownmesh-config = { path = "../ownmesh-config" }
ownmesh-domain = { path = "../ownmesh-domain" }
ownmesh-exec = { path = "../ownmesh-exec" }
ownmesh-fs = { path = "../ownmesh-fs" }
ownmesh-identity = { path = "../ownmesh-identity" }
ownmesh-ipc = { path = "../ownmesh-ipc" }
ownmesh-logs = { path = "../ownmesh-logs" }
ownmesh-policy = { path = "../ownmesh-policy" }
ownmesh-profiles = { path = "../ownmesh-profiles" }
ownmesh-protocol = { path = "../ownmesh-protocol" }
ownmesh-session = { path = "../ownmesh-session" }
ownmesh-session-host = { path = "../ownmesh-session-host" }
ownmesh-transfer = { path = "../ownmesh-transfer" }
ring = "0.17.14"
rustls = { version = "0.23.35", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
sha2 = "0.10"
tokio = { version = "1.43.0", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-native-roots",
] }
url = "2.5.4"
uuid = { version = "1.12.1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.15.0"
tokio = { version = "1.43.0", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }
