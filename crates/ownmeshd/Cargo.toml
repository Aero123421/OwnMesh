[package]
name = "ownmeshd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "OwnMesh user-level device agent daemon"
readme = "README.md"

[[bin]]
name = "ownmeshd"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { version = "4.5.27", features = ["derive", "env", "wrap_help"] }
ownmesh-config = { path = "../ownmesh-config" }
ownmesh-domain = { path = "../ownmesh-domain" }
ownmesh-identity = { path = "../ownmesh-identity" }
ownmesh-ipc = { path = "../ownmesh-ipc" }
serde_json = "1.0.135"
tokio = { version = "1.43.0", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.15.0"
tokio = { version = "1.43.0", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }
