[package]
name = "ownmesh-exec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "ownmesh-exec"
readme = "README.md"

# Windows exposes the configured OEM code page only through a tiny FFI surface.
# Keep it local to the decoder rather than spawning a shell or guessing a locale.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[dependencies]
ownmesh-domain = { path = "../ownmesh-domain" }
ownmesh-persist = { path = "../ownmesh-persist" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["process", "io-util", "macros", "rt-multi-thread", "time", "sync", "fs"] }
sha2 = "0.10"
hex = "0.4"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Globalization"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
