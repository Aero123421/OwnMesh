[package]
name = "ownmesh-exec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "ownmesh-exec"
readme = "README.md"

[lints]
workspace = true

[dependencies]
ownmesh-domain = { path = "../ownmesh-domain" }
ownmesh-persist = { path = "../ownmesh-persist" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["process", "io-util", "macros", "rt-multi-thread", "time", "sync", "fs"] }
sha2 = "0.11"
hex = "0.4"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["process"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
